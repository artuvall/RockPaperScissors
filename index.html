<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockPaperScissors</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sigmar&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <script src="script.js"></script>
    <div class="header">
        <div class="left-h">YanKenPo</div>
        <div class="right-h">
            <ul>
                <li><a href="">Rock</a></li>
                <li><a href="">Paper</a></li>
                <li><a href="">Scissors</a></li>
            </ul>
        </div>
    </div>
    <div class="center">
        <div class="title">Choose your favorite weapon to start:</div>
        <div class="container">
            <div class="square">
                <img src="https://static.wikia.nocookie.net/bobesponja/images/b/bd/Rocky.jpg/revision/latest/scale-to-width-down/1200?cb=20200908174328" alt="Rock Icon" class="img-btn">
            </div>
            <div class="square">
                <img src="https://static.wikia.nocookie.net/spongebob/images/b/b7/The_Paper_014.png/revision/latest?cb=20211209000621" alt="Paper Icon" class="img-btn">
            </div>
            <div class="square">
                <img src="https://i.pinimg.com/564x/3f/05/22/3f0522d65937c3d1816754e311f9507f.jpg" alt="Scissors Icon" class="img-btn">
            </div>
        </div>
        
    </div>
